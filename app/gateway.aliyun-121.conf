# Aliyun ECS 121 — IPv4 only (no public IPv6 on this host).
# Mounted over gateway.conf via docker-compose.aliyun-121.yml.

server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 仅供容器内 Prometheus exporter 抓取，不对宿主机暴露端口。
server {
    listen 8080;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

include /etc/nginx/app/*/*.conf;
