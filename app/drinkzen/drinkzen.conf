upstream drinkzen-api {
    server 111.229.38.208:31011;
}

upstream drinkzen-admin {
    server 111.229.38.208:31012;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.drinkzen.cn;

    return 301 https://drinkzen.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.drinkzen.cn;

    ssl_certificate /etc/nginx/cert/drinkzen/drinkzen.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/drinkzen/drinkzen.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    return 301 https://drinkzen.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drinkzen.cn;

    ssl_certificate /etc/nginx/cert/drinkzen/drinkzen.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/drinkzen/drinkzen.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    client_max_body_size 10m;

    access_log /var/log/nginx/drinkzen.access.log main;

    # Transitional route: switch to drinkzen-web after its gateway Service is deployed.
    location / {
        proxy_pass http://drinkzen-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

