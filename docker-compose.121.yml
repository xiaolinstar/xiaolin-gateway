# Overlay for ECS 121 when gateway colocates with life (:8080) and ai-todo (:8082).
# Usage on 121:
#   docker compose -f docker-compose.yml -f docker-compose.121.yml up -d
# Or set PRODUCTION_COMPOSE_FILE / COMPOSE_FILE accordingly in CD env.

services:
  nginx-gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/ai-todo/ai-todo.121.overlay:/etc/nginx/app/ai-todo/ai-todo.conf:ro
