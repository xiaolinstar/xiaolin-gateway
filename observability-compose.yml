# Optional observability stack. Merge when needed:
#   COMPOSE_FILE=docker-compose.yml:observability-compose.yml
# Local example:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml:observability-compose.yml

services:
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx-gateway:8080/stub_status
    depends_on:
      - nginx-gateway
    networks:
      - gateway-network
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - gateway-network
    restart: always

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
      - nginx-exporter
      - node-exporter
    networks:
      - gateway-network
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ${ALERTMANAGER_CONFIG:-./observability/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ./observability/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    networks:
      - gateway-network
    restart: always

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gateway-network
    restart: always

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
