upstream drink-budget-api {
    server 124.222.98.227:8020;
}

upstream drink-budget-admin {
    server 124.222.98.227:8030;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wodi.games www.wodi.games;

    ssl_certificate /etc/nginx/cert/drink-budget/wodi.games_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/drink-budget/wodi.games.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log  /var/log/nginx/drink-budget.access.log  main;

    location / {
        proxy_pass http://drink-budget-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.wodi.games;

    # Admin subdomain specific certificate
    ssl_certificate /etc/nginx/cert/drink-budget/admin.wodi.games_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/drink-budget/admin.wodi.games.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/drink-budget-admin.access.log main;
    error_log /var/log/nginx/drink-budget-admin.error.log warn;

    # Route 1: Admin Frontend SPA
    location / {
        proxy_pass http://drink-budget-admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Route 2: API Backend (for avoiding CORS)
    location /api {
        proxy_pass http://drink-budget-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}