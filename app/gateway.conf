# 统一网关入口：
# - 80：可选 HTTP->HTTPS（如需 ACME/回源校验，可在此放行特定路径）
# - 443：各项目 vhost 配置放在 app/<project>/*.conf，自动 include

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 仅供容器内 Prometheus exporter 抓取，不对宿主机暴露端口。
server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

include /etc/nginx/app/*/*.conf;
