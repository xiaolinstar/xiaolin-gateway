name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target Environment (tencent-101 auto on CI; aliyun-121 manual only)."
        required: true
        type: choice
        options:
          - tencent-101
          - aliyun-121
        default: tencent-101
      skip_party_helper_precheck:
        description: "Skip Party Helper upstream precheck (tencent-101 only)."
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # workflow_run has no inputs.* — always pin auto CD to tencent-101
  group: production-deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'tencent-101' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  BASE_ENV_FILE: .env
  DEPLOY_ENV_FILE: .env.production
  # Quote compose lists — unquoted YAML with multiple ":" is fragile in Actions.
  # Observability is appended when ENABLE_OBSERVABILITY resolves true (see job env).
  PRODUCTION_COMPOSE_BASE_TENCENT_101: "docker-compose.yml:docker-compose.tencent-101.yml"
  PRODUCTION_COMPOSE_BASE_ALIYUN_121: "docker-compose.yml:docker-compose.aliyun-121.yml"
  OBSERVABILITY_COMPOSE_FILE: "observability-compose.yml"

jobs:
  deploy-to-server:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'tencent-101' }}
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || 'tencent-101' }}
      SKIP_PARTY_HELPER_PRECHECK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_party_helper_precheck || false }}
      # Optional GitHub Environment Variable. Empty → default on for tencent-101, off for aliyun-121.
      ENABLE_OBSERVABILITY: ${{ vars.ENABLE_OBSERVABILITY }}

    steps:
      - name: Verify Party Helper H5 upstream and certificates
        if: ${{ env.DEPLOY_TARGET == 'tencent-101' && env.SKIP_PARTY_HELPER_PRECHECK != 'true' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            curl -fsS --max-time 15 http://111.229.38.208:30020/healthz | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value.get("ok") is True and value.get("service")=="party-helper-web"; print(value)'
            curl -fsS --max-time 15 -H "Origin: https://wodi.games" "http://111.229.38.208:30020/online/socket.io/?EIO=4&transport=polling" | python3 -c 'import json,sys; value=sys.stdin.read(); assert value.startswith("0"); packet=json.loads(value[1:]); assert "websocket" in packet["upgrades"]; print("online transport handshake ready")'
            openssl x509 -in app/party-helper/cert/wodi.games_bundle.crt -noout -checkhost wodi.games | grep -F "does match certificate"
            openssl x509 -in app/party-helper/cert/wodi.games_bundle.crt -noout -checkhost www.wodi.games | grep -F "does match certificate"
            openssl x509 -in app/party-helper/cert/wodi.games_bundle.crt -noout -checkend 604800

      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            git pull --ff-only

      - name: Ensure life + ai-todo cert files exist (aliyun-121)
        if: ${{ env.DEPLOY_TARGET == 'aliyun-121' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            if [[ ! -f app/xiaolin-life/cert/xiaolin.fun.pem || ! -f app/xiaolin-life/cert/xiaolin.fun.key \
               || ! -f app/ai-todo/cert/xingxiaolin.cn.pem || ! -f app/ai-todo/cert/xingxiaolin.cn.key ]]; then
              echo "life/ai-todo certs missing — generating short-lived placeholders for nginx -t"
              echo "Replace with real certs before DNS cutover"
              bash scripts/prepare-certs.sh
            fi
            openssl x509 -in app/xiaolin-life/cert/xiaolin.fun.pem -noout -checkend 60
            openssl x509 -in app/ai-todo/cert/xingxiaolin.cn.pem -noout -checkend 60

      - name: Resolve COMPOSE_FILE
        id: compose
        env:
          DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
          ENABLE_OBSERVABILITY: ${{ env.ENABLE_OBSERVABILITY }}
          BASE_101: ${{ env.PRODUCTION_COMPOSE_BASE_TENCENT_101 }}
          BASE_121: ${{ env.PRODUCTION_COMPOSE_BASE_ALIYUN_121 }}
          OBS_FILE: ${{ env.OBSERVABILITY_COMPOSE_FILE }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_TARGET" == "aliyun-121" ]]; then
            COMPOSE_BASE="$BASE_121"
            DEFAULT_OBS=false
          else
            COMPOSE_BASE="$BASE_101"
            DEFAULT_OBS=true
          fi
          ENABLE_OBS_RAW="${ENABLE_OBSERVABILITY:-}"
          if [[ -z "$ENABLE_OBS_RAW" ]]; then
            ENABLE_OBS_RAW="$DEFAULT_OBS"
          fi
          ENABLE_OBS_NORM="$(printf '%s' "$ENABLE_OBS_RAW" | tr '[:upper:]' '[:lower:]')"
          ENABLE_OBS=false
          case "$ENABLE_OBS_NORM" in
            1|true|yes|on) ENABLE_OBS=true ;;
          esac
          DESIRED_COMPOSE="$COMPOSE_BASE"
          if [[ "$ENABLE_OBS" == "true" ]]; then
            DESIRED_COMPOSE="${COMPOSE_BASE}:${OBS_FILE}"
          fi
          echo "ENABLE_OBSERVABILITY=$ENABLE_OBS"
          echo "COMPOSE_FILE=$DESIRED_COMPOSE"
          {
            echo "desired_compose=$DESIRED_COMPOSE"
            echo "enable_observability=$ENABLE_OBS"
          } >> "$GITHUB_OUTPUT"

      - name: Verify runtime env keys
        uses: appleboy/ssh-action@v1.0.0
        env:
          DESIRED_COMPOSE: ${{ steps.compose.outputs.desired_compose }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          envs: DESIRED_COMPOSE
          # Keep remote script minimal — host login shell may be zsh.
          script: |
            set -e
            cd ${{ env.SERVER_DIR }}
            test -f "${{ env.BASE_ENV_FILE }}"
            touch "${{ env.DEPLOY_ENV_FILE }}"
            echo "COMPOSE_FILE=${DESIRED_COMPOSE}"

            ensure_env_key() {
              file="$1"
              key="$2"
              value="$3"
              tmp="$(mktemp)"
              if [ -f "$file" ] && grep -qE "^${key}=" "$file"; then
                awk -v k="$key" -v v="$value" 'BEGIN{p=k"="} index($0,p)==1{$0=p v} {print}' "$file" >"$tmp"
              else
                if [ -f "$file" ]; then
                  cat "$file" >"$tmp"
                  printf '\n' >>"$tmp"
                else
                  : >"$tmp"
                fi
                printf '%s=%s\n' "$key" "$value" >>"$tmp"
              fi
              mv "$tmp" "$file"
            }

            EXAMPLE_PROD=".env.production.example"
            if [ -f "$EXAMPLE_PROD" ]; then
              awk '!/^[[:space:]]*#/ && index($0,"="){ sub(/^[[:space:]]+/,""); print }' "$EXAMPLE_PROD" | while IFS= read -r line; do
                [ -z "$line" ] && continue
                key="${line%%=*}"
                val="${line#*=}"
                if ! grep -qE "^${key}=" "${{ env.DEPLOY_ENV_FILE }}" 2>/dev/null; then
                  ensure_env_key "${{ env.DEPLOY_ENV_FILE }}" "$key" "$val"
                fi
              done
            fi

            ensure_env_key "${{ env.BASE_ENV_FILE }}" COMPOSE_FILE "${DESIRED_COMPOSE}"
            ensure_env_key "${{ env.DEPLOY_ENV_FILE }}" COMPOSE_FILE "${DESIRED_COMPOSE}"

            DEV_STANDARDS="${DEV_STANDARDS:-$HOME/AgentProjects/dev-standards}"
            CHECK="$DEV_STANDARDS/scripts/env/check-env-keys.sh"
            if [ -x "$CHECK" ]; then
              bash "$CHECK" --project . --strict --runtime .env --runtime .env.production --warn-extra
            else
              echo "warn: dev-standards check script not found (skip key validation)"
            fi

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            # shellcheck disable=SC1091
            set -a
            source .env
            # shellcheck disable=SC1091
            source .env.production
            set +a
            docker compose --env-file .env --env-file .env.production pull

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            set -a
            source .env
            source .env.production
            set +a
            docker compose --env-file .env --env-file .env.production up -d --remove-orphans

      - name: Verify nginx config and reload
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker exec nginx-gateway nginx -t
            docker exec nginx-gateway nginx -s reload

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
