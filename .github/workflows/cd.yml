name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  BASE_ENV_FILE: .env
  DEPLOY_ENV_FILE: .env.production

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            git pull

      - name: Verify runtime env keys
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            test -f "${{ env.BASE_ENV_FILE }}"
            DEV_STANDARDS="${DEV_STANDARDS:-$HOME/AgentProjects/dev-standards}"
            CHECK="$DEV_STANDARDS/scripts/env/check-env-keys.sh"
            if [[ -x "$CHECK" ]]; then
              bash "$CHECK" --project . --strict --runtime .env --runtime .env.production --warn-extra
            else
              echo "warn: dev-standards check script not found (skip key validation)"
            fi

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            docker compose --env-file .env --env-file .env.production pull

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            docker compose --env-file .env --env-file .env.production up -d --remove-orphans

      - name: Verify nginx config and reload
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker exec nginx-gateway nginx -t
            docker exec nginx-gateway nginx -s reload

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
