name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nginx-config:
    name: Nginx config test
    needs: [scan-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment and certificates
        run: |
          cp .env.example .env
          bash scripts/prepare-certs.sh
      - name: Test production config
        run: docker compose run --rm nginx-gateway nginx -t
      - name: Test local config overlay
        run: |
          cp .env.local.example .env.local
          docker compose --env-file .env --env-file .env.local run --rm nginx-gateway nginx -t

  env-templates:
    name: Env template key check
    needs: [scan-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: xiaolinstar/dev-standards
          path: dev-standards
      - name: Verify *.example templates (no L3 on runner)
        run: bash dev-standards/scripts/env/check-env-keys.sh --project .
