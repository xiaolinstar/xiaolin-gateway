name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  BASE_ENV_FILE: .env
  DEPLOY_ENV_FILE: .env.production

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            git pull

      - name: Verify runtime env file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f env/production.env ]; then
              echo "Using env/production.env"
            elif [ -f "${{ env.BASE_ENV_FILE }}" ]; then
              echo "Using legacy ${{ env.BASE_ENV_FILE }}"
            else
              echo "No runtime env file found."
              exit 1
            fi

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f env/production.env ]; then
              docker compose --env-file env/production.env pull
            else
              set -a
              . "./${{ env.BASE_ENV_FILE }}"
              if [ -f "${{ env.DEPLOY_ENV_FILE }}" ]; then
                . "./${{ env.DEPLOY_ENV_FILE }}"
              fi
              set +a
              docker compose pull
            fi

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f env/production.env ]; then
              docker compose --env-file env/production.env up -d --remove-orphans
            else
              set -a
              . "./${{ env.BASE_ENV_FILE }}"
              if [ -f "${{ env.DEPLOY_ENV_FILE }}" ]; then
                . "./${{ env.DEPLOY_ENV_FILE }}"
              fi
              set +a
              docker compose up -d --remove-orphans
            fi

      - name: Verify nginx config and reload
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker exec nginx-gateway nginx -t
            docker exec nginx-gateway nginx -s reload

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
