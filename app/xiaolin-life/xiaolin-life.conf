# xiaolin.fun — static site on same host as gateway (121 colocate).
# Upstream uses host.docker.internal (requires extra_hosts host-gateway on nginx-gateway).

upstream xiaolin-life-web {
    server host.docker.internal:8080;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xiaolin.fun www.xiaolin.fun;

    ssl_certificate     /etc/nginx/cert/xiaolin-life/xiaolin.fun_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/xiaolin-life/xiaolin.fun.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/xiaolin-life.access.log main;

    location / {
        proxy_pass http://xiaolin-life-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
