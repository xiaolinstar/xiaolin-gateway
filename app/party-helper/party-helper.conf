upstream party-helper-api {
    server 111.229.38.208:30021;
}

upstream party-helper-admin {
    server 111.229.38.208:30024;
}

server {
    listen 80;
    listen [::]:80;
    server_name wodi.games www.wodi.games;

    return 301 https://api.wodi.games$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wodi.games www.wodi.games;

    ssl_certificate /etc/nginx/cert/party-helper/wodi.games_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/party-helper/wodi.games.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    return 301 https://api.wodi.games$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.wodi.games;

    ssl_certificate /etc/nginx/cert/party-helper/api.wodi.games_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/party-helper/api.wodi.games.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log  /var/log/nginx/party-helper.access.log  main;

    location / {
        proxy_pass http://party-helper-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.wodi.games;

    ssl_certificate /etc/nginx/cert/party-helper/admin.wodi.games_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/party-helper/admin.wodi.games.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/party-helper-admin.access.log main;
    error_log /var/log/nginx/party-helper-admin.error.log warn;

    location / {
        proxy_pass http://party-helper-admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
