name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  COMPOSE_ENV_FILE: env/production.env
  LEGACY_COMPOSE_ENV_FILE: .env

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            git pull

      - name: Verify runtime env file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            test -f "${{ env.COMPOSE_ENV_FILE }}" || test -f "${{ env.LEGACY_COMPOSE_ENV_FILE }}"

      - name: Validate compose model
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f "${{ env.COMPOSE_ENV_FILE }}" ]; then
              docker compose --env-file "${{ env.COMPOSE_ENV_FILE }}" config --services
            else
              docker compose --env-file "${{ env.LEGACY_COMPOSE_ENV_FILE }}" config --services
            fi

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f "${{ env.COMPOSE_ENV_FILE }}" ]; then
              docker compose --env-file "${{ env.COMPOSE_ENV_FILE }}" pull
            else
              docker compose --env-file "${{ env.LEGACY_COMPOSE_ENV_FILE }}" pull
            fi

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            if [ -f "${{ env.COMPOSE_ENV_FILE }}" ]; then
              docker compose --env-file "${{ env.COMPOSE_ENV_FILE }}" up -d --remove-orphans --wait --wait-timeout 180
            else
              docker compose --env-file "${{ env.LEGACY_COMPOSE_ENV_FILE }}" up -d --remove-orphans --wait --wait-timeout 180
            fi

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
