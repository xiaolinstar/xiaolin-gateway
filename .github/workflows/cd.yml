name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to target server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ${{ env.SERVER_DIR }}
            git pull
            COMPOSE_ENV_ARGS=""
            if [ -f env/production.env ]; then
              COMPOSE_ENV_ARGS="--env-file env/production.env"
            elif [ -f .env ]; then
              echo "Using legacy root .env. Prefer env/production.env for runtime config."
            else
              echo "No runtime env file found. Create env/production.env from env/production.env.example."
              exit 1
            fi
            docker compose $COMPOSE_ENV_ARGS pull
            docker compose $COMPOSE_ENV_ARGS down
            docker compose $COMPOSE_ENV_ARGS up -d
            docker image prune -f
            echo "Deployment completed successfully!"
