services:
  nginx-gateway:
    image: nginx:alpine3.20-perl
    container_name: nginx-gateway
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./app/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/etc/nginx/app:ro
      - ./app/xiaolin-docs/cert:/etc/nginx/cert/xiaolin-docs:ro
      - ./app/xiaolin-life/cert:/etc/nginx/cert/xiaolin-life:ro
      - ./app/ai-todo/cert:/etc/nginx/cert/ai-todo:ro
      - ./app/drink-budget/cert:/etc/nginx/cert/drink-budget:ro
      - ./app/party-helper/cert:/etc/nginx/cert/party-helper:ro
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

networks:
  gateway-network:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.35.0.0/16
        - subnet: fd00:abcd::/48
