groups:
  - name: gateway.targets
    rules:
      - alert: PrometheusTargetDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "Prometheus target {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: GatewayExporterDown
        expr: up{job="nginx"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nginx exporter is down"
          description: "Nginx exporter target {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter is down"
          description: "Node exporter target {{ $labels.instance }} has been down for more than 2 minutes."

  - name: gateway.host
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{
              job="node",
              fstype!~"tmpfs|devtmpfs|overlay",
              mountpoint!~"/(run|var/lib/docker/.+|snap/.+)"
            }
            /
            node_filesystem_size_bytes{
              job="node",
              fstype!~"tmpfs|devtmpfs|overlay",
              mountpoint!~"/(run|var/lib/docker/.+|snap/.+)"
            }
          ) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space is low"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free space for more than 10 minutes."

      - alert: HostDiskWillFillSoon
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{
              job="node",
              fstype!~"tmpfs|devtmpfs|overlay",
              mountpoint!~"/(run|var/lib/docker/.+|snap/.+)"
            }[6h],
            24 * 3600
          ) < 0
          and
          (
            node_filesystem_avail_bytes{
              job="node",
              fstype!~"tmpfs|devtmpfs|overlay",
              mountpoint!~"/(run|var/lib/docker/.+|snap/.+)"
            }
            /
            node_filesystem_size_bytes{
              job="node",
              fstype!~"tmpfs|devtmpfs|overlay",
              mountpoint!~"/(run|var/lib/docker/.+|snap/.+)"
            }
          ) * 100 < 30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host disk may fill within 24 hours"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is projected to run out of space within 24 hours."

      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory pressure is high"
          description: "Host {{ $labels.instance }} has less than 10% available memory for more than 10 minutes."

      - alert: HostHighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU load is high"
          description: "Host {{ $labels.instance }} CPU usage has stayed above 85% for more than 15 minutes."
