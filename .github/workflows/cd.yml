name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  BASE_ENV_FILE: .env
  DEPLOY_ENV_FILE: .env.production
  PRODUCTION_COMPOSE_FILE: docker-compose.yml:observability-compose.yml

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            git pull

      - name: Verify runtime env keys
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            test -f "${{ env.BASE_ENV_FILE }}"
            touch "${{ env.DEPLOY_ENV_FILE }}"

            ensure_env_key() {
              local file="$1"
              local key="$2"
              local value="$3"

              if ! grep -qE "^${key}=" "$file"; then
                printf '\n%s=%s\n' "$key" "$value" >> "$file"
              fi
            }

            ensure_env_key "${{ env.BASE_ENV_FILE }}" COMPOSE_FILE "${{ env.PRODUCTION_COMPOSE_FILE }}"
            ensure_env_key "${{ env.DEPLOY_ENV_FILE }}" COMPOSE_FILE "${{ env.PRODUCTION_COMPOSE_FILE }}"

            DEV_STANDARDS="${DEV_STANDARDS:-$HOME/AgentProjects/dev-standards}"
            CHECK="$DEV_STANDARDS/scripts/env/check-env-keys.sh"
            if [[ -x "$CHECK" ]]; then
              bash "$CHECK" --project . --strict --runtime .env --runtime .env.production --warn-extra
            else
              echo "warn: dev-standards check script not found (skip key validation)"
            fi

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            export COMPOSE_FILE="${COMPOSE_FILE:-${{ env.PRODUCTION_COMPOSE_FILE }}}"
            docker compose --env-file .env --env-file .env.production pull

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ env.SERVER_DIR }}
            export COMPOSE_FILE="${COMPOSE_FILE:-${{ env.PRODUCTION_COMPOSE_FILE }}}"
            docker compose --env-file .env --env-file .env.production up -d --remove-orphans

      - name: Verify nginx config and reload
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker exec nginx-gateway nginx -t
            docker exec nginx-gateway nginx -s reload

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
