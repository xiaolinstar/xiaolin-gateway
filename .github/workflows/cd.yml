name: CD Pipeline, Deploy to Target Server

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVER_DIR: ~/AgentProjects/xiaolin-gateway
  BASE_ENV_FILE: .env
  DEPLOY_ENV_FILE: .env.production

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      - name: Sync repository
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            git pull

      - name: Verify runtime env file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            test -f "${{ env.BASE_ENV_FILE }}"

      - name: Pull service images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            set -a
            . "./${{ env.BASE_ENV_FILE }}"
            if [ -f "${{ env.DEPLOY_ENV_FILE }}" ]; then
              . "./${{ env.DEPLOY_ENV_FILE }}"
            fi
            set +a
            docker compose pull

      - name: Apply desired compose state
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            cd ${{ env.SERVER_DIR }}
            set -a
            . "./${{ env.BASE_ENV_FILE }}"
            if [ -f "${{ env.DEPLOY_ENV_FILE }}" ]; then
              . "./${{ env.DEPLOY_ENV_FILE }}"
            fi
            set +a
            docker compose up -d --remove-orphans

      - name: Prune unused images
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            docker image prune -f
