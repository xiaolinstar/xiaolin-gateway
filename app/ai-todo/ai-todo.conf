upstream ai-todo-api {
    server 124.222.98.227:8082;
}

upstream ai-todo-api-staging {
    server 121.199.175.147:8083;
}

# Staging 环境
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.staging.xingxiaolin.cn staging.xingxiaolin.cn;

    ssl_certificate /etc/nginx/cert/ai-todo/www.staging.xingxiaolin.cn.pem;
    ssl_certificate_key /etc/nginx/cert/ai-todo/www.staging.xingxiaolin.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log  /var/log/nginx/ai-todo-staging.access.log  main;

    location / {
        proxy_pass http://ai-todo-api-staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# 主域名
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xingxiaolin.cn www.xingxiaolin.cn;

    ssl_certificate /etc/nginx/cert/ai-todo/www.xingxiaolin.cn.pem;
    ssl_certificate_key /etc/nginx/cert/ai-todo/www.xingxiaolin.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    access_log  /var/log/nginx/host.access.log  main;

    location / {
        proxy_pass http://ai-todo-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
